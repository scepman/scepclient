# Automatically approve and merge Dependabot PRs that update GitHub Actions.
# Other Dependabot PRs (npm, nuget, …) are left untouched.

name: Dependabot auto-merge GitHub Actions
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-actions:
    runs-on: ubuntu-latest
    # Author: Dependabot opened the PR. Actor: Dependabot made the push that triggered this run (not anyone else (e.g., an attacker) adding commits).
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' # zizmor: ignore[bot-conditions] actor is an extra AND-ed restriction, not the sole check
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Pin approval and merge to the commit this run checked, so later pushes are not covered.
      - name: Approve and auto-merge GitHub Actions updates
        if: steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" -f event=APPROVE -f commit_id="$HEAD_SHA"
          gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
